syntax = "proto3";

package useraddressservice;

// User Address Service Definition
service UserAddressService {
  // User operations
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (GetUserResponse);

  // Address operations
  rpc GetUserAddress (GetUserAddressRequest) returns (GetUserAddressResponse);
  rpc CreateUserAddress (CreateUserAddressRequest) returns (UserAddressResponse);
  rpc UpdateUserAddress (UpdateUserAddressRequest) returns (UserAddressResponse);
  rpc DeleteUserAddress (DeleteUserAddressRequest) returns (DeleteUserAddressResponse);
  rpc GetUserAddressesByUserId (GetUserAddressesByUserIdRequest) returns (GetUserAddressesResponse);
}

// User-related messages
message GetUserRequest {
  string user_id = 1; // GUID as string
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserResponse {
  bool exists = 1;
  string user_id = 2;  // Fixed: was inconsistent
  string username = 3;
  string email = 4;
}

// Address-related messages
message GetUserAddressRequest {
  string address_id = 1; // GUID as string
}

message GetUserAddressesByUserIdRequest {
  string user_id = 1;
}

message GetUserAddressesResponse {
  repeated UserAddressResponse addresses = 1;
}

message CreateUserAddressRequest {
  string user_id = 1;
  string address1 = 2;
  optional string address2 = 3;
  string city = 4;
  string state = 5;
  string zip_code = 6;
}

message UpdateUserAddressRequest {
  string address_id = 1;
  string user_id = 2;
  string address1 = 3;
  optional string address2 = 4;
  string city = 5;
  string state = 6;
  string zip_code = 7;
}

message DeleteUserAddressRequest {
  string address_id = 1;
}

message DeleteUserAddressResponse {
  bool success = 1;
  string message = 2;
}

message GetUserAddressResponse {
  bool exists = 1;
  UserAddressResponse address = 2;
}

message UserAddressResponse {
  string id = 1;
  string user_id = 2;
  string address1 = 3;
  optional string address2 = 4;
  string city = 5;
  string state = 6;
  string zip_code = 7;
}
