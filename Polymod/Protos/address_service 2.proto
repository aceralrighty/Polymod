syntax = "proto3";

package addressservice;

// Address Service - Owns all address-related operations
// Depends on UserService for user validation
service AddressService {
  // Core address operations
  rpc GetAddress (GetAddressRequest) returns (GetAddressResponse);
  rpc GetUserAddresses (GetUserAddressesRequest) returns (GetUserAddressesResponse);
  rpc CreateAddress (CreateAddressRequest) returns (CreateAddressResponse);
  rpc UpdateAddress (UpdateAddressRequest) returns (UpdateAddressResponse);
  rpc DeleteAddress (DeleteAddressRequest) returns (DeleteAddressResponse);

  // Analytics operations
  rpc GetAddressesByState (GetAddressesByStateRequest) returns (GetAddressesByStateResponse);
  rpc GetAddressesByCity (GetAddressesByCityRequest) returns (GetAddressesByCityResponse);
  rpc GetAddressesByZipCode (GetAddressesByZipCodeRequest) returns (GetAddressesByZipCodeResponse);

  // Bulk operations
  rpc BulkCreateAddresses (BulkCreateAddressesRequest) returns (BulkCreateAddressesResponse);
}

// === Request Messages ===
message GetAddressRequest {
  string address_id = 1; // GUID as string
}

message GetUserAddressesRequest {
  string user_id = 1; // GUID as string
}

message CreateAddressRequest {
  string user_id = 1;
  string address1 = 2;
  optional string address2 = 3;
  string city = 4;
  string state = 5;
  string zip_code = 6;
}

message UpdateAddressRequest {
  string address_id = 1;
  string user_id = 2;
  string address1 = 3;
  optional string address2 = 4;
  string city = 5;
  string state = 6;
  string zip_code = 7;
}

message DeleteAddressRequest {
  string address_id = 1;
}

message GetAddressesByStateRequest {
  string state = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetAddressesByCityRequest {
  string city = 1;
  string state = 2; // Optional filter
  int32 page_size = 3;
  string page_token = 4;
}

message GetAddressesByZipCodeRequest {
  string zip_code = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message BulkCreateAddressesRequest {
  repeated CreateAddressRequest addresses = 1;
}

// === Response Messages ===
message GetAddressResponse {
  bool exists = 1;
  Address address = 2;
}

message GetUserAddressesResponse {
  repeated Address addresses = 1;
  int32 total_count = 2;
}

message CreateAddressResponse {
  bool success = 1;
  string message = 2;
  Address address = 3;
}

message UpdateAddressResponse {
  bool success = 1;
  string message = 2;
  Address address = 3;
}

message DeleteAddressResponse {
  bool success = 1;
  string message = 2;
}

message GetAddressesByStateResponse {
  repeated Address addresses = 1;
  string next_page_token = 2;
  int32 total_count = 3;
  AddressGrouping grouping = 4;
}

message GetAddressesByCityResponse {
  repeated Address addresses = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetAddressesByZipCodeResponse {
  repeated Address addresses = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message BulkCreateAddressesResponse {
  int32 created_count = 1;
  int32 failed_count = 2;
  repeated CreateAddressResponse results = 3;
}

// === Data Messages ===
message Address {
  string id = 1;           // GUID as string
  string user_id = 2;      // GUID as string
  string address1 = 3;
  optional string address2 = 4;
  string city = 5;
  string state = 6;
  string zip_code = 7;
  string created_at = 8;   // ISO 8601 timestamp
  string updated_at = 9;   // ISO 8601 timestamp
}

message AddressGrouping {
  string group_by = 1;     // "state", "city", "zip_code"
  repeated AddressGroup groups = 2;
}

message AddressGroup {
  string key = 1;          // The grouping value (state name, city name, etc.)
  int32 count = 2;
  repeated Address addresses = 3; // Optional - might be empty for summary views
}
