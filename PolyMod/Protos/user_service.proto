syntax = "proto3";

package userservice;

// User Service - Owns all user-related operations
service UserService {
  // Core user operations
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (GetUserResponse);
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);

  // Validation operations (used by other services)
  rpc UserExists (UserExistsRequest) returns (UserExistsResponse);
  rpc ValidateUsers (ValidateUsersRequest) returns (ValidateUsersResponse);
}

// === Request Messages ===
message GetUserRequest {
  string user_id = 1; // GUID as string
}

message GetUserByEmailRequest {
  string email = 1;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string username = 2;
  optional string email = 3;
  optional string password = 4;
}

message DeleteUserRequest {
  string user_id = 1;
}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message UserExistsRequest {
  string user_id = 1;
}

message ValidateUsersRequest {
  repeated string user_ids = 1;
}

// === Response Messages ===
message GetUserResponse {
  bool exists = 1;
  User user = 2;
}

message CreateUserResponse {
  bool success = 1;
  string message = 2;
  User user = 3;
}

message UpdateUserResponse {
  bool success = 1;
  string message = 2;
  User user = 3;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UserExistsResponse {
  bool exists = 1;
  User user = 2; // Optional - for when you need basic user info
}

message ValidateUsersResponse {
  repeated UserValidation validations = 1;
}

// === Data Messages ===
message User {
  string id = 1;           // GUID as string
  string username = 2;
  string email = 3;
  string created_at = 4;   // ISO 8601 timestamp
  string updated_at = 5;   // ISO 8601 timestamp
  // Note: Password is never returned in responses
}

message UserValidation {
  string user_id = 1;
  bool exists = 2;
  User user = 3; // Only populated if exists = true
}
