name: PolyMod CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      monolith-changed: ${{ steps.changes.outputs.monolith }}
      stock-service-changed: ${{ steps.changes.outputs.stock-service }}
      tests-changed: ${{ steps.changes.outputs.tests }}
      shared-changed: ${{ steps.changes.outputs.shared }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            monolith:
              - 'PolyModSolution/PolyMod/**'
            stock-service:
              - '**/StockPredictionService/**'
              - '!**/StockPredictionService/**/*Test*.cs'
              - '!**/StockPredictionService/**/*Tests*.cs'
            tests:
              - 'TestProject/**'
              - '**/*Test*/**'
              - '**/*Tests*/**'
              - '**/*Test*.cs'
              - '**/*Tests*.cs'
            shared:
              - '*.props'
              - '*.targets'
              - '.github/workflows/**'

  find-paths:
    runs-on: ubuntu-latest
    outputs:
      stock-service-path: ${{ steps.find-paths.outputs.stock-service-path }}
      stock-service-project: ${{ steps.find-paths.outputs.stock-service-project }}
      monolith-path: ${{ steps.find-paths.outputs.monolith-path }}
      monolith-project: ${{ steps.find-paths.outputs.monolith-project }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug repository structure
        run: |
          echo "🔍 Repository structure debug:"
          echo "Root contents:"
          ls -la
          echo ""
          echo "Looking for PolyModSolution directory:"
          if [ -d "PolyModSolution" ]; then
            echo "✅ PolyModSolution found"
            echo "Contents of PolyModSolution:"
            ls -la PolyModSolution/
          else
            echo "❌ PolyModSolution not found"
          fi
          echo ""
          echo "All .csproj files in repository:"
          find . -name "*.csproj" -type f 2>/dev/null || echo "No .csproj files found"

      - name: Find project paths
        id: find-paths
        run: |
          echo "🔍 Searching for project paths..."

          # Check known locations first based on your local structure
          STOCK_SERVICE_DIR=""
          STOCK_SERVICE_PROJECT=""
          MONOLITH_DIR=""
          MONOLITH_PROJECT=""

          # Check for PolyModSolution/StockPredictionService (your confirmed structure)
          if [ -f "PolyModSolution/StockPredictionService/StockPredictionService.csproj" ]; then
            STOCK_SERVICE_DIR="PolyModSolution/StockPredictionService"
            STOCK_SERVICE_PROJECT="PolyModSolution/StockPredictionService/StockPredictionService.csproj"
            echo "✅ Found StockPredictionService at expected location: $STOCK_SERVICE_PROJECT"
          else
            echo "❌ StockPredictionService not found at PolyModSolution/StockPredictionService/"
            # Fallback: search everywhere
            STOCK_SERVICE_PROJECT=$(find . -name "StockPredictionService.csproj" -type f 2>/dev/null | head -1)
            if [ -n "$STOCK_SERVICE_PROJECT" ]; then
              STOCK_SERVICE_DIR=$(dirname "$STOCK_SERVICE_PROJECT")
              echo "✅ Found StockPredictionService via search: $STOCK_SERVICE_PROJECT"
            else
              echo "❌ StockPredictionService.csproj not found anywhere"
            fi
          fi

          # Check for PolyModSolution/PolyMod (assuming monolith is in same solution)
          if [ -f "PolyModSolution/PolyMod/PolyMod.csproj" ]; then
            MONOLITH_DIR="PolyModSolution/PolyMod"
            MONOLITH_PROJECT="PolyModSolution/PolyMod/PolyMod.csproj"
            echo "✅ Found PolyMod at expected location: $MONOLITH_PROJECT"
          else
            echo "⚠️ PolyMod not found at PolyModSolution/PolyMod/"
            # Fallback: search everywhere
            MONOLITH_PROJECT=$(find . -name "PolyMod.csproj" -type f 2>/dev/null | head -1)
            if [ -n "$MONOLITH_PROJECT" ]; then
              MONOLITH_DIR=$(dirname "$MONOLITH_PROJECT")
              echo "✅ Found PolyMod via search: $MONOLITH_PROJECT"
            else
              echo "⚠️ PolyMod.csproj not found - this is OK if monolith isn't in the repo"
            fi
          fi

          # Output the paths
          echo "stock-service-path=${STOCK_SERVICE_DIR}" >> $GITHUB_OUTPUT
          echo "stock-service-project=${STOCK_SERVICE_PROJECT}" >> $GITHUB_OUTPUT
          echo "monolith-path=${MONOLITH_DIR}" >> $GITHUB_OUTPUT
          echo "monolith-project=${MONOLITH_PROJECT}" >> $GITHUB_OUTPUT

          echo ""
          echo "📍 Final discovered paths:"
          echo "  Stock Service Dir: '${STOCK_SERVICE_DIR}'"
          echo "  Stock Service Project: '${STOCK_SERVICE_PROJECT}'"
          echo "  Monolith Dir: '${MONOLITH_DIR}'"
          echo "  Monolith Project: '${MONOLITH_PROJECT}'"

  build-monolith:
    runs-on: ubuntu-latest
    needs: [detect-changes, find-paths]
    if: needs.detect-changes.outputs.monolith-changed == 'true' || needs.detect-changes.outputs.shared-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if PolyMod exists
        id: check-monolith
        run: |
          if [ -n "${{ needs.find-paths.outputs.monolith-project }}" ] && [ -f "${{ needs.find-paths.outputs.monolith-project }}" ]; then
            echo "monolith-exists=true" >> $GITHUB_OUTPUT
            echo "✅ Found PolyMod project at: ${{ needs.find-paths.outputs.monolith-project }}"
          else
            echo "monolith-exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ PolyMod project not found - skipping monolith build"
          fi

      - name: Setup .NET
        if: steps.check-monolith.outputs.monolith-exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore PolyMod (Monolith)
        if: steps.check-monolith.outputs.monolith-exists == 'true'
        run: dotnet restore "${{ needs.find-paths.outputs.monolith-project }}"

      - name: Build PolyMod (Monolith)
        if: steps.check-monolith.outputs.monolith-exists == 'true'
        run: dotnet build "${{ needs.find-paths.outputs.monolith-project }}" --no-restore --configuration Release

      - name: Test PolyMod (if tests exist)
        if: steps.check-monolith.outputs.monolith-exists == 'true'
        run: |
          MONOLITH_DIR="${{ needs.find-paths.outputs.monolith-path }}"
          if [ -f "${MONOLITH_DIR}/../PolyMod.Tests/PolyMod.Tests.csproj" ]; then
            dotnet test "${MONOLITH_DIR}/../PolyMod.Tests/PolyMod.Tests.csproj" --configuration Release --verbosity normal
          elif find "$MONOLITH_DIR" -name "*Test*.csproj" -o -name "*Tests*.csproj" | head -1 >/dev/null; then
            dotnet test "$MONOLITH_DIR" --configuration Release --verbosity normal
          else
            echo "⚠️ No specific tests found for PolyMod monolith"
          fi

  build-stock-service:
    runs-on: ubuntu-latest
    needs: [detect-changes, find-paths]
    if: needs.detect-changes.outputs.stock-service-changed == 'true' || needs.detect-changes.outputs.shared-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if StockPredictionService exists
        id: check-stock-service
        run: |
          if [ -n "${{ needs.find-paths.outputs.stock-service-project }}" ] && [ -f "${{ needs.find-paths.outputs.stock-service-project }}" ]; then
            echo "stock-service-exists=true" >> $GITHUB_OUTPUT
            echo "✅ Found StockPredictionService project at: ${{ needs.find-paths.outputs.stock-service-project }}"
          else
            echo "stock-service-exists=false" >> $GITHUB_OUTPUT
            echo "❌ StockPredictionService project not found"
            echo "Repository contents:"
            find . -name "*.csproj" -type f 2>/dev/null || echo "No .csproj files found"
            exit 1
          fi

      - name: Setup .NET
        if: steps.check-stock-service.outputs.stock-service-exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Clean test files from production code
        if: steps.check-stock-service.outputs.stock-service-exists == 'true'
        run: |
          SERVICE_DIR="${{ needs.find-paths.outputs.stock-service-path }}"
          if [ -n "$SERVICE_DIR" ] && [ -d "$SERVICE_DIR" ]; then
            echo "🧹 Cleaning test files from: $SERVICE_DIR"
            find "$SERVICE_DIR" -name "*Test*.cs" -type f -delete 2>/dev/null || true
            find "$SERVICE_DIR" -name "*Tests*.cs" -type f -delete 2>/dev/null || true
          fi

      - name: Restore Stock Prediction Service
        if: steps.check-stock-service.outputs.stock-service-exists == 'true'
        run: |
          echo "📦 Restoring project: ${{ needs.find-paths.outputs.stock-service-project }}"
          dotnet restore "${{ needs.find-paths.outputs.stock-service-project }}"

      - name: Build Stock Prediction Service
        if: steps.check-stock-service.outputs.stock-service-exists == 'true'
        run: |
          echo "🔨 Building project: ${{ needs.find-paths.outputs.stock-service-project }}"
          dotnet build "${{ needs.find-paths.outputs.stock-service-project }}" --no-restore --configuration Release

      - name: Test Stock Prediction Service
        if: steps.check-stock-service.outputs.stock-service-exists == 'true'
        run: |
          echo "⚠️ No separate test project found for Stock Prediction Service"
          echo "Creating basic test structure would be recommended"

  run-integration-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.tests-changed == 'true' || needs.detect-changes.outputs.shared-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check if TestProject exists
        id: check-tests
        run: |
          if [ -f "TestProject/TestProject.csproj" ]; then
            echo "tests-exist=true" >> $GITHUB_OUTPUT
          else
            echo "tests-exist=false" >> $GITHUB_OUTPUT
            echo "⚠️ No TestProject found"
          fi

      - name: Run integration tests
        if: steps.check-tests.outputs.tests-exist == 'true'
        run: |
          dotnet restore TestProject/TestProject.csproj
          dotnet test TestProject/TestProject.csproj --configuration Release --verbosity normal

  code-quality:
    runs-on: ubuntu-latest
    needs: [detect-changes, find-paths]
    if: |
      needs.detect-changes.outputs.monolith-changed == 'true' ||
      needs.detect-changes.outputs.stock-service-changed == 'true' ||
      needs.detect-changes.outputs.shared-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Clean test files from production code
        run: |
          SERVICE_DIR="${{ needs.find-paths.outputs.stock-service-path }}"
          if [ -n "$SERVICE_DIR" ] && [ -d "$SERVICE_DIR" ]; then
            echo "🧹 Cleaning test files from: $SERVICE_DIR"
            find "$SERVICE_DIR" -name "*Test*.cs" -type f -delete 2>/dev/null || true
            find "$SERVICE_DIR" -name "*Tests*.cs" -type f -delete 2>/dev/null || true
          fi

      - name: Restore dependencies
        run: |
          if [[ "${{ needs.detect-changes.outputs.monolith-changed }}" == "true" ]] && [ -n "${{ needs.find-paths.outputs.monolith-project }}" ]; then
            echo "📦 Restoring PolyMod: ${{ needs.find-paths.outputs.monolith-project }}"
            dotnet restore "${{ needs.find-paths.outputs.monolith-project }}"
          fi

          if [[ "${{ needs.detect-changes.outputs.stock-service-changed }}" == "true" ]] && [ -n "${{ needs.find-paths.outputs.stock-service-project }}" ]; then
            echo "📦 Restoring StockPredictionService: ${{ needs.find-paths.outputs.stock-service-project }}"
            dotnet restore "${{ needs.find-paths.outputs.stock-service-project }}"
          fi

      - name: Format code
        run: |
          if [[ "${{ needs.detect-changes.outputs.monolith-changed }}" == "true" ]] && [ -n "${{ needs.find-paths.outputs.monolith-project }}" ]; then
            echo "🎨 Formatting PolyMod: ${{ needs.find-paths.outputs.monolith-project }}"
            dotnet format "${{ needs.find-paths.outputs.monolith-project }}" --verbosity diagnostic
          fi

          if [[ "${{ needs.detect-changes.outputs.stock-service-changed }}" == "true" ]] && [ -n "${{ needs.find-paths.outputs.stock-service-project }}" ]; then
            echo "🎨 Formatting StockPredictionService: ${{ needs.find-paths.outputs.stock-service-project }}"
            dotnet format "${{ needs.find-paths.outputs.stock-service-project }}" --verbosity diagnostic
          fi

      - name: Build for analysis
        run: |
          if [[ "${{ needs.detect-changes.outputs.monolith-changed }}" == "true" ]] && [ -n "${{ needs.find-paths.outputs.monolith-project }}" ]; then
            echo "🔨 Building PolyMod for analysis: ${{ needs.find-paths.outputs.monolith-project }}"
            dotnet build "${{ needs.find-paths.outputs.monolith-project }}" --no-restore
          fi

          if [[ "${{ needs.detect-changes.outputs.stock-service-changed }}" == "true" ]] && [ -n "${{ needs.find-paths.outputs.stock-service-project }}" ]; then
            echo "🔨 Building StockPredictionService for analysis: ${{ needs.find-paths.outputs.stock-service-project }}"
            dotnet build "${{ needs.find-paths.outputs.stock-service-project }}" --no-restore
          fi

  security-scan:
    runs-on: ubuntu-latest
    needs: [detect-changes, find-paths]
    if: |
      needs.detect-changes.outputs.monolith-changed == 'true' ||
      needs.detect-changes.outputs.stock-service-changed == 'true' ||
      needs.detect-changes.outputs.shared-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-outdated
        run: dotnet tool install --global dotnet-outdated-tool

      - name: Clean test files from production code
        run: |
          SERVICE_DIR="${{ needs.find-paths.outputs.stock-service-path }}"
          if [ -n "$SERVICE_DIR" ] && [ -d "$SERVICE_DIR" ]; then
            echo "🧹 Cleaning test files from: $SERVICE_DIR"
            find "$SERVICE_DIR" -name "*Test*.cs" -type f -delete 2>/dev/null || true
            find "$SERVICE_DIR" -name "*Tests*.cs" -type f -delete 2>/dev/null || true
            echo "✅ Test file cleanup completed"
          else
            echo "⚠️ StockPredictionService directory not found or path is empty"
            echo "SERVICE_DIR value: '$SERVICE_DIR'"
            echo "Available directories in repository:"
            find . -type d -name "*Stock*" 2>/dev/null || echo "No directories matching *Stock* found"
          fi

      - name: Security scan - PolyMod (Monolith)
        if: needs.detect-changes.outputs.monolith-changed == 'true'
        run: |
          MONOLITH_PROJECT="${{ needs.find-paths.outputs.monolith-project }}"
          if [ -n "$MONOLITH_PROJECT" ] && [ -f "$MONOLITH_PROJECT" ]; then
            echo "🔒 Security scanning PolyMod: $MONOLITH_PROJECT"
            dotnet restore "$MONOLITH_PROJECT"
            dotnet list "$MONOLITH_PROJECT" package --vulnerable --include-transitive || echo "⚠️ No vulnerabilities found or command failed"
            export PATH="$PATH:$HOME/.dotnet/tools"
            dotnet outdated "$MONOLITH_PROJECT" || echo "⚠️ Outdated package check completed"
          else
            echo "⚠️ PolyMod project not found - skipping security scan"
          fi

      - name: Security scan - Stock Prediction Service
        if: needs.detect-changes.outputs.stock-service-changed == 'true'
        run: |
          SERVICE_PROJECT="${{ needs.find-paths.outputs.stock-service-project }}"
          if [ -n "$SERVICE_PROJECT" ] && [ -f "$SERVICE_PROJECT" ]; then
            echo "🔒 Security scanning StockPredictionService: $SERVICE_PROJECT"
            dotnet restore "$SERVICE_PROJECT"
            dotnet list "$SERVICE_PROJECT" package --vulnerable --include-transitive || echo "⚠️ No vulnerabilities found or command failed"
            export PATH="$PATH:$HOME/.dotnet/tools"
            dotnet outdated "$SERVICE_PROJECT" || echo "⚠️ Outdated package check completed"
          else
            echo "❌ StockPredictionService project not found - failing security scan"
            exit 1
          fi

  ci-success:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-monolith, build-stock-service, run-integration-tests, code-quality, security-scan]
    if: always()

    steps:
      - name: Check CI Results
        run: |
          echo "🔍 Checking CI results..."
          echo "Changes detected:"
          echo "  - Monolith: ${{ needs.detect-changes.outputs.monolith-changed }}"
          echo "  - Stock Service: ${{ needs.detect-changes.outputs.stock-service-changed }}"
          echo "  - Tests: ${{ needs.detect-changes.outputs.tests-changed }}"
          echo "  - Shared: ${{ needs.detect-changes.outputs.shared-changed }}"
          echo ""
          echo "Job results:"
          echo "  - Build Monolith: ${{ needs.build-monolith.result }}"
          echo "  - Build Stock Service: ${{ needs.build-stock-service.result }}"
          echo "  - Integration Tests: ${{ needs.run-integration-tests.result }}"
          echo "  - Code Quality: ${{ needs.code-quality.result }}"
          echo "  - Security Scan: ${{ needs.security-scan.result }}"

          # Check if any changes were detected
          CHANGES_DETECTED=false
          if [[ "${{ needs.detect-changes.outputs.monolith-changed }}" == "true" ||
                "${{ needs.detect-changes.outputs.stock-service-changed }}" == "true" ||
                "${{ needs.detect-changes.outputs.tests-changed }}" == "true" ||
                "${{ needs.detect-changes.outputs.shared-changed }}" == "true" ]]; then
            CHANGES_DETECTED=true
          fi

          if [[ "$CHANGES_DETECTED" == "false" ]]; then
            echo "✅ No changes detected - CI pipeline completed successfully!"
            exit 0
          fi

          # Count skipped and success as OK
          FAILED_JOBS=""

          if [[ "${{ needs.build-monolith.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS build-monolith"
          fi

          if [[ "${{ needs.build-stock-service.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS build-stock-service"
          fi

          if [[ "${{ needs.run-integration-tests.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS run-integration-tests"
          fi

          if [[ "${{ needs.code-quality.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS code-quality"
          fi

          if [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS security-scan"
          fi

          if [[ -z "$FAILED_JOBS" ]]; then
            echo "✅ All CI checks passed or skipped appropriately!"
          else
            echo "❌ The following jobs failed: $FAILED_JOBS"
            exit 1
          fi
