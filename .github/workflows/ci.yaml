name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore

      # Build existing services
      - name: Build Stock Prediction Service
        run: dotnet build StockPredictionService/StockPredictionService.csproj --no-restore --configuration Release

      # Run tests if they exist
      - name: Check if tests exist
        id: check-tests
        run: |
          if [ -d "TestProject" ]; then
            echo "tests-exist=true" >> $GITHUB_OUTPUT
          else
            echo "tests-exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.check-tests.outputs.tests-exist == 'true'
        run: dotnet test TestProject/TestProject.csproj --no-build --configuration Release --verbosity normal

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Fix code formatting
        run: dotnet format StockPredictionService/ --verbosity diagnostic

      - name: Build for analysis
        run: dotnet build StockPredictionService/StockPredictionService.csproj --no-restore

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Vulnerability scan
        run: dotnet list package --vulnerable --include-transitive

      - name: Install dotnet-outdated
        run: dotnet tool install --global dotnet-outdated-tool

      - name: Check for outdated packages
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet list package --outdated

  # Simple success check
  ci-success:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, security-scan]
    if: always()

    steps:
      - name: Check CI Results
        run: |
          if [[ "${{ needs.build-and-test.result }}" == "success" &&
                "${{ needs.code-quality.result }}" == "success" &&
                "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
          else
            echo "❌ Some CI checks failed"
            echo "Build and Test: ${{ needs.build-and-test.result }}"
            echo "Code Quality: ${{ needs.code-quality.result }}"
            echo "Security Scan: ${{ needs.security-scan.result }}"
            exit 1
          fi
