name: PolyMod CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      monolith-changed: ${{ steps.changes.outputs.monolith }}
      stock-service-changed: ${{ steps.changes.outputs.stock-service }}
      tests-changed: ${{ steps.changes.outputs.tests }}
      shared-changed: ${{ steps.changes.outputs.shared }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            monolith:
              - 'PolyModSolution/PolyMod/**'
            stock-service:
              - 'PolyModSolution/StockPredictionService/**'
              - '!PolyModSolution/StockPredictionService/**/*Test*.cs'
              - '!PolyModSolution/StockPredictionService/**/*Tests*.cs'
            tests:
              - 'TestProject/**'
              - '**/*Test*/**'
              - '**/*Tests*/**'
              - '**/*Test*.cs'
              - '**/*Tests*.cs'
            shared:
              - '*.props'
              - '*.targets'
              - '.github/workflows/**'

  build-monolith:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.monolith-changed == 'true' || needs.detect-changes.outputs.shared-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if PolyMod directory exists
        id: check-monolith
        run: |
          if [ -d "PolyModSolution/PolyMod" ]; then
            echo "monolith-exists=true" >> $GITHUB_OUTPUT
          else
            echo "monolith-exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ PolyModSolution/PolyMod directory not found - skipping monolith build"
          fi

      - name: Setup .NET
        if: steps.check-monolith.outputs.monolith-exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore PolyMod (Monolith)
        if: steps.check-monolith.outputs.monolith-exists == 'true'
        working-directory: PolyModSolution/PolyMod
        run: dotnet restore

      - name: Build PolyMod (Monolith)
        if: steps.check-monolith.outputs.monolith-exists == 'true'
        working-directory: PolyModSolution/PolyMod
        run: dotnet build --no-restore --configuration Release

      - name: Test PolyMod (if tests exist)
        if: steps.check-monolith.outputs.monolith-exists == 'true'
        working-directory: PolyModSolution/PolyMod
        run: |
          if [ -f "../PolyMod.Tests/PolyMod.Tests.csproj" ]; then
            cd ../PolyMod.Tests
            dotnet test --configuration Release --verbosity normal
          elif find . -name "*Test*.csproj" -o -name "*Tests*.csproj" | head -1; then
            dotnet test --configuration Release --verbosity normal
          else
            echo "⚠️ No specific tests found for PolyMod monolith"
          fi

  build-stock-service:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.stock-service-changed == 'true' || needs.detect-changes.outputs.shared-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          echo "Repository root contents:"
          ls -la
          echo ""
          echo "Looking for StockPredictionService..."
          find . -name "*StockPrediction*" -type d 2>/dev/null || echo "No StockPredictionService directories found"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Clean test files from production code
        run: |
          # Find the actual StockPredictionService directory
          SERVICE_DIR=""
          if [ -d "PolyModSolution/StockPredictionService" ]; then
            SERVICE_DIR="PolyModSolution/StockPredictionService"
          elif [ -d "StockPredictionService" ]; then
            SERVICE_DIR="StockPredictionService"
          elif [ -d "PolyMod/StockPredictionService" ]; then
            SERVICE_DIR="PolyMod/StockPredictionService"
          fi

          if [ -n "$SERVICE_DIR" ]; then
            echo "Found StockPredictionService at: $SERVICE_DIR"
            find "$SERVICE_DIR" -name "*Test*.cs" -type f -delete 2>/dev/null || true
            find "$SERVICE_DIR" -name "*Tests*.cs" -type f -delete 2>/dev/null || true
          else
            echo "⚠️ StockPredictionService directory not found - skipping test file cleanup"
          fi

      - name: Restore Stock Prediction Service
        run: |
          # Find the actual project file
          PROJECT_FILE=""
          if [ -f "PolyModSolution/StockPredictionService/StockPredictionService.csproj" ]; then
            PROJECT_FILE="PolyModSolution/StockPredictionService/StockPredictionService.csproj"
          elif [ -f "StockPredictionService/StockPredictionService.csproj" ]; then
            PROJECT_FILE="StockPredictionService/StockPredictionService.csproj"
          elif [ -f "PolyMod/StockPredictionService/StockPredictionService.csproj" ]; then
            PROJECT_FILE="PolyMod/StockPredictionService/StockPredictionService.csproj"
          fi

          if [ -n "$PROJECT_FILE" ]; then
            echo "Restoring project: $PROJECT_FILE"
            dotnet restore "$PROJECT_FILE"
          else
            echo "❌ StockPredictionService.csproj not found"
            exit 1
          fi

      - name: Build Stock Prediction Service
        run: |
          # Find the actual project file
          PROJECT_FILE=""
          if [ -f "PolyModSolution/StockPredictionService/StockPredictionService.csproj" ]; then
            PROJECT_FILE="PolyModSolution/StockPredictionService/StockPredictionService.csproj"
          elif [ -f "StockPredictionService/StockPredictionService.csproj" ]; then
            PROJECT_FILE="StockPredictionService/StockPredictionService.csproj"
          elif [ -f "PolyMod/StockPredictionService/StockPredictionService.csproj" ]; then
            PROJECT_FILE="PolyMod/StockPredictionService/StockPredictionService.csproj"
          fi

          if [ -n "$PROJECT_FILE" ]; then
            echo "Building project: $PROJECT_FILE"
            dotnet build "$PROJECT_FILE" --no-restore --configuration Release
          else
            echo "❌ StockPredictionService.csproj not found"
            exit 1
          fi

      - name: Test Stock Prediction Service
        run: |
          echo "⚠️ No separate test project found for Stock Prediction Service"
          echo "Creating basic test structure would be recommended"

  run-integration-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.tests-changed == 'true' || needs.detect-changes.outputs.shared-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Check if TestProject exists
        id: check-tests
        run: |
          if [ -f "TestProject/TestProject.csproj" ]; then
            echo "tests-exist=true" >> $GITHUB_OUTPUT
          else
            echo "tests-exist=false" >> $GITHUB_OUTPUT
            echo "⚠️ No TestProject found"
          fi

      - name: Run integration tests
        if: steps.check-tests.outputs.tests-exist == 'true'
        run: |
          dotnet restore TestProject/TestProject.csproj
          dotnet test TestProject/TestProject.csproj --configuration Release --verbosity normal

  code-quality:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.monolith-changed == 'true' ||
      needs.detect-changes.outputs.stock-service-changed == 'true' ||
      needs.detect-changes.outputs.shared-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Clean test files from production code
        run: |
          # Find the actual StockPredictionService directory
          SERVICE_DIR=""
          if [ -d "PolyModSolution/StockPredictionService" ]; then
            SERVICE_DIR="PolyModSolution/StockPredictionService"
          elif [ -d "StockPredictionService" ]; then
            SERVICE_DIR="StockPredictionService"
          elif [ -d "PolyMod/StockPredictionService" ]; then
            SERVICE_DIR="PolyMod/StockPredictionService"
          fi

          if [ -n "$SERVICE_DIR" ]; then
            echo "Found StockPredictionService at: $SERVICE_DIR"
            find "$SERVICE_DIR" -name "*Test*.cs" -type f -delete 2>/dev/null || true
            find "$SERVICE_DIR" -name "*Tests*.cs" -type f -delete 2>/dev/null || true
          else
            echo "⚠️ StockPredictionService directory not found - skipping test file cleanup"
          fi

      - name: Restore dependencies
        run: |
          # Restore individual projects since there's no solution file
          if [[ "${{ needs.detect-changes.outputs.monolith-changed }}" == "true" ]]; then
            POLYMOD_PROJECT=""
            if [ -f "PolyModSolution/PolyMod/PolyMod.csproj" ]; then
              POLYMOD_PROJECT="PolyModSolution/PolyMod/PolyMod.csproj"
            elif [ -f "PolyMod/PolyMod.csproj" ]; then
              POLYMOD_PROJECT="PolyMod/PolyMod.csproj"
            fi

            if [ -n "$POLYMOD_PROJECT" ]; then
              echo "Restoring PolyMod: $POLYMOD_PROJECT"
              dotnet restore "$POLYMOD_PROJECT"
            fi
          fi

          if [[ "${{ needs.detect-changes.outputs.stock-service-changed }}" == "true" ]]; then
            SERVICE_PROJECT=""
            if [ -f "PolyModSolution/StockPredictionService/StockPredictionService.csproj" ]; then
              SERVICE_PROJECT="PolyModSolution/StockPredictionService/StockPredictionService.csproj"
            elif [ -f "StockPredictionService/StockPredictionService.csproj" ]; then
              SERVICE_PROJECT="StockPredictionService/StockPredictionService.csproj"
            elif [ -f "PolyMod/StockPredictionService/StockPredictionService.csproj" ]; then
              SERVICE_PROJECT="PolyMod/StockPredictionService/StockPredictionService.csproj"
            fi

            if [ -n "$SERVICE_PROJECT" ]; then
              echo "Restoring StockPredictionService: $SERVICE_PROJECT"
              dotnet restore "$SERVICE_PROJECT"
            fi
          fi

      - name: Format code
        run: |
          # Format individual projects
          if [[ "${{ needs.detect-changes.outputs.monolith-changed }}" == "true" ]]; then
            POLYMOD_PROJECT=""
            if [ -f "PolyModSolution/PolyMod/PolyMod.csproj" ]; then
              POLYMOD_PROJECT="PolyModSolution/PolyMod/PolyMod.csproj"
            elif [ -f "PolyMod/PolyMod.csproj" ]; then
              POLYMOD_PROJECT="PolyMod/PolyMod.csproj"
            fi

            if [ -n "$POLYMOD_PROJECT" ]; then
              echo "Formatting PolyMod: $POLYMOD_PROJECT"
              dotnet format "$POLYMOD_PROJECT" --verbosity diagnostic
            fi
          fi

          if [[ "${{ needs.detect-changes.outputs.stock-service-changed }}" == "true" ]]; then
            SERVICE_PROJECT=""
            if [ -f "PolyModSolution/StockPredictionService/StockPredictionService.csproj" ]; then
              SERVICE_PROJECT="PolyModSolution/StockPredictionService/StockPredictionService.csproj"
            elif [ -f "StockPredictionService/StockPredictionService.csproj" ]; then
              SERVICE_PROJECT="StockPredictionService/StockPredictionService.csproj"
            elif [ -f "PolyMod/StockPredictionService/StockPredictionService.csproj" ]; then
              SERVICE_PROJECT="PolyMod/StockPredictionService/StockPredictionService.csproj"
            fi

            if [ -n "$SERVICE_PROJECT" ]; then
              echo "Formatting StockPredictionService: $SERVICE_PROJECT"
              dotnet format "$SERVICE_PROJECT" --verbosity diagnostic
            fi
          fi

      - name: Build for analysis
        run: |
          if [[ "${{ needs.detect-changes.outputs.monolith-changed }}" == "true" ]]; then
            POLYMOD_PROJECT=""
            if [ -f "PolyModSolution/PolyMod/PolyMod.csproj" ]; then
              POLYMOD_PROJECT="PolyModSolution/PolyMod/PolyMod.csproj"
            elif [ -f "PolyMod/PolyMod.csproj" ]; then
              POLYMOD_PROJECT="PolyMod/PolyMod.csproj"
            fi

            if [ -n "$POLYMOD_PROJECT" ]; then
              echo "Building PolyMod for analysis: $POLYMOD_PROJECT"
              dotnet build "$POLYMOD_PROJECT" --no-restore
            fi
          fi

          if [[ "${{ needs.detect-changes.outputs.stock-service-changed }}" == "true" ]]; then
            SERVICE_PROJECT=""
            if [ -f "PolyModSolution/StockPredictionService/StockPredictionService.csproj" ]; then
              SERVICE_PROJECT="PolyModSolution/StockPredictionService/StockPredictionService.csproj"
            elif [ -f "StockPredictionService/StockPredictionService.csproj" ]; then
              SERVICE_PROJECT="StockPredictionService/StockPredictionService.csproj"
            elif [ -f "PolyMod/StockPredictionService/StockPredictionService.csproj" ]; then
              SERVICE_PROJECT="PolyMod/StockPredictionService/StockPredictionService.csproj"
            fi

            if [ -n "$SERVICE_PROJECT" ]; then
              echo "Building StockPredictionService for analysis: $SERVICE_PROJECT"
              dotnet build "$SERVICE_PROJECT" --no-restore
            fi
          fi

  security-scan:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.monolith-changed == 'true' ||
      needs.detect-changes.outputs.stock-service-changed == 'true' ||
      needs.detect-changes.outputs.shared-changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Install dotnet-outdated
        run: dotnet tool install --global dotnet-outdated-tool

      - name: Clean test files from production code
        run: |
          find PolyModSolution/StockPredictionService -name "*Test*.cs" -type f -delete
          find PolyModSolution/StockPredictionService -name "*Tests*.cs" -type f -delete

      - name: Security scan - PolyMod (Monolith)
        if: needs.detect-changes.outputs.monolith-changed == 'true'
        run: |
          dotnet restore PolyModSolution/PolyMod/PolyMod.csproj
          dotnet list PolyModSolution/PolyMod/PolyMod.csproj package --vulnerable --include-transitive
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet outdated PolyModSolution/PolyMod/PolyMod.csproj

      - name: Security scan - Stock Prediction Service
        if: needs.detect-changes.outputs.stock-service-changed == 'true'
        run: |
          dotnet restore PolyModSolution/StockPredictionService/StockPredictionService.csproj
          dotnet list PolyModSolution/StockPredictionService/StockPredictionService.csproj package --vulnerable --include-transitive
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet outdated PolyModSolution/StockPredictionService/StockPredictionService.csproj

  ci-success:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-monolith, build-stock-service, run-integration-tests, code-quality, security-scan]
    if: always()

    steps:
      - name: Check CI Results
        run: |
          echo "🔍 Checking CI results..."
          echo "Changes detected:"
          echo "  - Monolith: ${{ needs.detect-changes.outputs.monolith-changed }}"
          echo "  - Stock Service: ${{ needs.detect-changes.outputs.stock-service-changed }}"
          echo "  - Tests: ${{ needs.detect-changes.outputs.tests-changed }}"
          echo "  - Shared: ${{ needs.detect-changes.outputs.shared-changed }}"
          echo ""
          echo "Job results:"
          echo "  - Build Monolith: ${{ needs.build-monolith.result }}"
          echo "  - Build Stock Service: ${{ needs.build-stock-service.result }}"
          echo "  - Integration Tests: ${{ needs.run-integration-tests.result }}"
          echo "  - Code Quality: ${{ needs.code-quality.result }}"
          echo "  - Security Scan: ${{ needs.security-scan.result }}"

          # Check if any changes were detected
          CHANGES_DETECTED=false
          if [[ "${{ needs.detect-changes.outputs.monolith-changed }}" == "true" ||
                "${{ needs.detect-changes.outputs.stock-service-changed }}" == "true" ||
                "${{ needs.detect-changes.outputs.tests-changed }}" == "true" ||
                "${{ needs.detect-changes.outputs.shared-changed }}" == "true" ]]; then
            CHANGES_DETECTED=true
          fi

          if [[ "$CHANGES_DETECTED" == "false" ]]; then
            echo "✅ No changes detected - CI pipeline completed successfully!"
            exit 0
          fi

          # Count skipped and success as OK
          FAILED_JOBS=""

          if [[ "${{ needs.build-monolith.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS build-monolith"
          fi

          if [[ "${{ needs.build-stock-service.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS build-stock-service"
          fi

          if [[ "${{ needs.run-integration-tests.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS run-integration-tests"
          fi

          if [[ "${{ needs.code-quality.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS code-quality"
          fi

          if [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
            FAILED_JOBS="$FAILED_JOBS security-scan"
          fi

          if [[ -z "$FAILED_JOBS" ]]; then
            echo "✅ All CI checks passed or skipped appropriately!"
          else
            echo "❌ The following jobs failed: $FAILED_JOBS"
            exit 1
          fi
